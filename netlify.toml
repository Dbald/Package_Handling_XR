# Static site, no build step. Connect the repo in Netlify (or drag-and-drop
# the repo folder); Netlify serves it over HTTPS, which WebXR requires.
[build]
  publish = "."
  command = "npm test"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "xr-spatial-tracking=(self)"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
